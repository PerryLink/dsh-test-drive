<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="dsh-test-drive structure: one owned temp root as a clean-room envelope holding three throwaway sub-roots and the five-stage spine (install, config, smoke, capability, uninstall); a finally drain removes the root on every exit path, while the structured record and the ordered verdict rules leave the envelope on the right and the host profile stays outside, never opened">
