name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # No `registry-url` on purpose: it makes setup-node write
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc, and a
          # configured bearer token is preferred over the OIDC exchange. With the
          # NPM_TOKEN secret retired that line is an EMPTY bearer token, so the
          # registry answered 404 on PUT for v0.3.16 -- after the provenance statement
          # had already been signed. Trusted publishing reads no secret, so both the
          # `registry-url` line and the NODE_AUTH_TOKEN env are gone.
      - name: Refuse a tag that does not name the package version
        run: node scripts/check-tag-version.mjs "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run typecheck:ci
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run verify:self-contained
      - run: pnpm run verify:artifacts
      - name: Render the changelog section for the release body
        run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      # npm must be >= 11.5.1 to perform the trusted-publishing exchange itself; the
      # npm bundled with Node 22 is 10.x and never requests an OIDC token.
      - run: npm install -g npm@^11.5.1
      - name: Publish to npm (skip an already-published version)
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-test-drive@${version}" version >/dev/null 2>&1; then
            echo "dsh-test-drive@${version} is already published; skipping npm publish"
          else
            set +e
            out="$(npm publish --access public --provenance 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$out"
            if [ "$status" -ne 0 ] && ! printf '%s' "$out" | grep -q 'E409'; then
              exit "$status"
            fi
          fi
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
