name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Refuse a tag that does not name the package version
        run: node scripts/check-tag-version.mjs "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run typecheck:ci
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run verify:self-contained
      - run: pnpm run verify:artifacts
      - name: Render the changelog section for the release body
        run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      - run: pnpm publish --provenance --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
