name: compat

# Monthly real-profile install verification: installs this package into a
# throwaway DSH_HOME profile with the REAL dsh CLI + pnpm, then proves the
# bundle patch composes. The temp home is created by this workflow, printed
# before use, and removed by its exact path only.
on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Install the dsh CLI
        run: npm install --global @deepseek-ai/dsh@0.1.0-rc.6
      - name: Create a throwaway DSH_HOME
        id: home
        run: |
          TEMP_HOME="$(mktemp -d -t dsh-compat-home-XXXXXX)"
          echo "throwaway DSH_HOME: ${TEMP_HOME}"
          echo "path=${TEMP_HOME}" >> "$GITHUB_OUTPUT"
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-compat-home
      - name: Install this package into the throwaway profile
        run: dsh plugin --profile headless add ./
        env:
          DSH_HOME: ${{ steps.home.outputs.path }}
      - name: Verify the bundle patch composes
        run: |
          dsh --profile headless --dump-config > dump.yml
          grep -E '# == .*dsh-test-drive' dump.yml
          grep -E '^\s*name:\s*["'"'"']?dsh-test-drive' dump.yml
        env:
          DSH_HOME: ${{ steps.home.outputs.path }}
      - name: Remove the package from the throwaway profile
        run: dsh plugin --profile headless remove dsh-test-drive
        env:
          DSH_HOME: ${{ steps.home.outputs.path }}
      - name: Remove the throwaway DSH_HOME (exact owned path only)
        if: always()
        run: |
          echo "removing throwaway DSH_HOME: ${{ steps.home.outputs.path }}"
          rm -rf -- "${{ steps.home.outputs.path }}"
